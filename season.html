<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Season Standings</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e2e2e2;
    --accent: #0b5fff;
    --win-bg: #e6f4ea;
    --win-text: #1e7a34;
    --loss-bg: #fdeaea;
    --loss-text: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --border: #2a2d35;
      --accent: #4d8dff;
      --win-bg: #133d20;
      --win-text: #6fd08c;
      --loss-bg: #3d1414;
      --loss-text: #f28b82;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 28px 0 10px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
  nav { margin-bottom: 20px; font-size: 0.85rem; }
  nav a { color: var(--accent); text-decoration: none; margin-right: 12px; }
  nav a:hover { text-decoration: underline; }
  .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
  .table-scroll {
    max-width: 760px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  table {
    width: 100%;
    min-width: 420px;
    border-collapse: collapse;
  }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  th { background: color-mix(in srgb, var(--card) 90%, var(--accent)); font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .week-heading { margin: 24px 0 8px; font-size: 0.9rem; font-weight: 600; color: var(--muted); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
  .pill.pending { background: color-mix(in srgb, var(--card) 85%, var(--muted)); color: var(--muted); }
  .pill.win { background: var(--win-bg); color: var(--win-text); }
  .pill.loss { background: var(--loss-bg); color: var(--loss-text); }
  .pill.push { background: color-mix(in srgb, var(--card) 85%, var(--accent)); color: var(--accent); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 480px) {
    body { padding: 16px 12px 48px; }
    th, td { padding: 8px 10px; font-size: 0.85rem; }
  }
</style>
</head>
<body>
  <h1>Season Standings</h1>
  <div class="subtitle">Every pick, every week, graded.</div>
  <nav><a href="index.html">Odds board</a><a href="pick.html">Make a pick</a><a href="picks.html">This week's picks</a></nav>
  <div class="status" id="status">Loading…</div>
  <div id="leaderboardWrap"></div>
  <div id="historyWrap"></div>

<script>
  const API_BASE = "https://falbr3r26g.execute-api.us-east-1.amazonaws.com";

  function fmtSpread(price) {
    if (!price || price.odds == null) return "&mdash;";
    const line = price.line != null ? (price.line > 0 ? `+${price.line} ` : `${price.line} `) : "";
    const odds = price.odds > 0 ? `+${price.odds}` : `${price.odds}`;
    return `${line}${odds}`;
  }

  function resultPill(pick) {
    const r = pick.result || "pending";
    const label = r === "pending" ? "Pending" : r.charAt(0).toUpperCase() + r.slice(1);
    let scoreText = "";
    if (r !== "pending" && pick.final_score_for != null) {
      scoreText = ` (${pick.final_score_for}-${pick.final_score_against})`;
    }
    return `<span class="pill ${r}">${label}${scoreText}</span>`;
  }

  function formatWeekLabel(weekKey) {
    const m = /^(\d{4})-wk(\d{2})$/.exec(weekKey || "");
    if (!m) return weekKey || "unknown";
    return `Week ${Number(m[2])}, ${m[1]}`;
  }

  const DOLLARS_OWED_PER_LOSS = 10;

  function buildLeaderboard(picks, nameById) {
    const stats = new Map();
    for (const p of picks) {
      if (!stats.has(p.member_id)) {
        stats.set(p.member_id, { name: nameById.get(p.member_id) || p.member_id, wins: 0, losses: 0, pushes: 0, pending: 0 });
      }
      const s = stats.get(p.member_id);
      if (p.result === "win") s.wins++;
      else if (p.result === "loss") s.losses++;
      else if (p.result === "push") s.pushes++;
      else s.pending++;
    }
    for (const s of stats.values()) s.owed = s.losses * DOLLARS_OWED_PER_LOSS;
    return [...stats.values()].sort((a, b) => b.wins - a.wins || a.losses - b.losses);
  }

  async function load() {
    const statusEl = document.getElementById("status");
    const leaderboardWrap = document.getElementById("leaderboardWrap");
    const historyWrap = document.getElementById("historyWrap");

    try {
      const [picksRes, membersRes] = await Promise.all([
        fetch(`${API_BASE}/picks`, { cache: "no-store" }),
        fetch(`${API_BASE}/members`, { cache: "no-store" })
      ]);
      if (!picksRes.ok) throw new Error(`HTTP ${picksRes.status}`);
      const data = await picksRes.json();
      const membersData = membersRes.ok ? await membersRes.json() : { members: [] };
      const nameById = new Map(membersData.members.map(m => [m.member_id, m.name]));

      const picks = (data.picks || []).map(p => ({ ...p, display_name: nameById.get(p.member_id) || p.member_id }));

      statusEl.textContent = `${picks.length} pick${picks.length === 1 ? "" : "s"} across the season`;

      if (!picks.length) {
        leaderboardWrap.innerHTML = "";
        historyWrap.innerHTML = '<div class="empty">No picks yet this season.</div>';
        return;
      }

      const leaderboard = buildLeaderboard(picks, nameById);
      leaderboardWrap.innerHTML = `
        <h2>Standings</h2>
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th>Member</th><th class="num">W</th><th class="num">L</th><th class="num">Push</th><th class="num">Pending</th><th class="num">Owed</th></tr>
            </thead>
            <tbody>
              ${leaderboard.map(s => `
                <tr>
                  <td>${s.name}</td>
                  <td class="num">${s.wins}</td>
                  <td class="num">${s.losses}</td>
                  <td class="num">${s.pushes}</td>
                  <td class="num">${s.pending}</td>
                  <td class="num">$${s.owed}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;

      const byWeek = new Map();
      for (const p of picks) {
        if (!byWeek.has(p.week)) byWeek.set(p.week, []);
        byWeek.get(p.week).push(p);
      }
      const weeks = [...byWeek.keys()].sort();

      historyWrap.innerHTML = weeks.map(week => {
        const weekPicks = byWeek.get(week).sort((a, b) => a.display_name.localeCompare(b.display_name));
        const rows = weekPicks.map(p => `
          <tr>
            <td>${p.display_name}</td>
            <td>${p.team_name}</td>
            <td>${p.opponent_name}</td>
            <td>${fmtSpread(p.spread_at_pick)}</td>
            <td>${resultPill(p)}</td>
          </tr>
        `).join("");
        return `
          <div class="week-heading">${formatWeekLabel(week)}</div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr><th>Member</th><th>Pick</th><th>Opponent</th><th>Spread at pick</th><th>Result</th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }).join("");
    } catch (err) {
      statusEl.textContent = `Failed to load season picks: ${err.message}`;
    }
  }

  load();
</script>
</body>
</html>
