<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NCAAF FanDuel Odds</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e2e2e2;
    --accent: #0b5fff;
    --live-bg: #fdeaea;
    --live-text: #b3261e;
    --final-bg: #e6f4ea;
    --final-text: #1e7a34;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --border: #454b5a;
      --accent: #4d8dff;
      --live-bg: #3d1414;
      --live-text: #f28b82;
      --final-bg: #133d20;
      --final-text: #6fd08c;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0 auto;
    max-width: 480px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .status {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .table-scroll {
    max-width: 480px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .table-scroll + .week-heading { margin-top: 24px; }
  .week-heading { margin: 0 0 8px; font-size: 0.9rem; font-weight: 600; color: var(--muted); }
  .team-record-row { color: var(--muted); font-size: 0.8rem; margin: 1px 0 0 23px; }
  .at-row { color: var(--muted); font-size: 0.85rem; margin: 5px 0; }
  table {
    width: 100%;
    min-width: 320px;
    border-collapse: collapse;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  /* Shrink the Score column to fit its content instead of stretching with
     the table - keeps it snug against the Matchup column. A class rather
     than :last-child, since Matchup becomes the last (only) column when
     the Score column is hidden entirely (no games have started yet). */
  .score-col {
    width: 1%;
    white-space: nowrap;
    padding-right: 8px;
    vertical-align: top;
  }
  th {
    background: color-mix(in srgb, var(--card) 90%, var(--accent));
    font-weight: 600;
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  .alt-row td { background: color-mix(in srgb, var(--card) 55%, var(--bg)); }
  .day-header td {
    background: color-mix(in srgb, var(--card) 80%, var(--accent));
    font-weight: 700;
    font-size: 0.85rem;
    padding: 7px 12px;
  }
  .team-row { font-weight: 600; white-space: nowrap; }
  .team-row + .team-row { margin-top: 2px; }
  .team-row.covered { color: var(--final-text); }
  .team-logo { width: 18px; height: 18px; vertical-align: -3px; margin-right: 5px; object-fit: contain; border-radius: 3px; background: #fff; padding: 1px; }
  .kickoff { color: var(--muted); font-size: 0.8rem; margin-top: 5px; }
  .odds-cell { font-variant-numeric: tabular-nums; }
  .score-row { font-weight: 600; font-variant-numeric: tabular-nums; }
  .score-row + .score-row { margin-top: 14px; }
  .status-line { margin-top: 3px; }
  .status-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    vertical-align: 1px;
  }
  .status-badge.live {
    background: var(--live-bg);
    color: var(--live-text);
  }
  .status-badge.live::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--live-text);
    margin-right: 4px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .status-badge.final {
    background: var(--final-bg);
    color: var(--final-text);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  nav { margin-bottom: 16px; font-size: 0.85rem; }
  nav a { color: var(--accent); text-decoration: none; margin-right: 12px; }
  nav a:hover { text-decoration: underline; }
  .nav-toggle {
    display: none;
    width: 34px;
    height: 34px;
    padding: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }
  .nav-toggle span { display: block; width: 16px; height: 2px; background: var(--text); border-radius: 1px; }
  .page-head { display: flex; flex-direction: column; }
  @media (min-width: 601px) and (min-height: 501px) {
    .page-head nav { order: 1; }
  }
  @media (max-width: 600px), (max-height: 500px) {
    nav { display: flex; justify-content: flex-start; position: relative; }
    .nav-toggle { display: flex; }
    .nav-links {
      display: none;
      position: absolute;
      top: 42px;
      left: 0;
      z-index: 20;
      flex-direction: column;
      gap: 2px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 0;
      min-width: 190px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    }
    .nav-links.open { display: flex; }
    .nav-links a { margin-right: 0; padding: 10px 16px; }
  }
  @media (max-width: 480px) {
    body { padding: 16px 12px 48px; }
    th, td { padding: 8px 10px; font-size: 0.85rem; }
  }
</style>
</head>
<body>
  <div class="page-head">
    <nav>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="nav-links" id="navLinks">
        <a href="pick.html">Make Your Pick</a>
        <a href="picks.html">This Week's Picks</a>
        <a href="season.html">Season Standings</a>
        <a href="recap.html">Weekly Recap</a>
      </div>
    </nav>
    <div class="title-block">
      <h1 id="pageTitle">NCAAF Odds</h1>
      <div class="subtitle">Point spread for upcoming games.<br>Times shown are your device's local time zone.</div>
    </div>
  </div>
  <div class="status" id="status">Loading…</div>
  <div id="tableWrap"></div>

<script>
  const navToggle = document.getElementById("navToggle");
  const navLinks = document.getElementById("navLinks");
  if (navToggle) {
    navToggle.addEventListener("click", () => {
      const isOpen = navLinks.classList.toggle("open");
      navToggle.setAttribute("aria-expanded", String(isOpen));
    });
    document.addEventListener("click", (e) => {
      if (!navLinks.classList.contains("open")) return;
      if (navLinks.contains(e.target) || navToggle.contains(e.target)) return;
      navLinks.classList.remove("open");
      navToggle.setAttribute("aria-expanded", "false");
    });
  }

  const DATA_URL = "https://familysportspool-odds-044528206038.s3.us-east-1.amazonaws.com/ncaaf/fanduel/latest.json";
  const SCORES_URL = "https://familysportspool-odds-044528206038.s3.us-east-1.amazonaws.com/ncaaf/fanduel/scores.json";
  const TEAM_INFO_URL = "https://familysportspool-odds-044528206038.s3.us-east-1.amazonaws.com/ncaaf/fanduel/team-info.json";
  const TEAMS_URL = "https://familysportspool-odds-044528206038.s3.us-east-1.amazonaws.com/ncaaf/teams.json";
  const REFRESH_MS = 2 * 60 * 1000;

  function logoImg(logoUrl, teamName) {
    return logoUrl ? `<img class="team-logo" src="${logoUrl}" alt="" loading="lazy" />` : "";
  }

  // Returns which side (home/away) is favored and by how much, so the
  // spread can be displayed next to the correct team - not just appended
  // to the end of the matchup string, which would misattribute it whenever
  // the away team (not home) is favored.
  function favoriteSide(g) {
    const h = g.spread?.home, a = g.spread?.away;
    if (!h || !a || h.line == null || a.line == null) return null;
    if (h.line === 0) return { side: "pk", line: "PK" };
    return h.line < 0 ? { side: "home", line: `${h.line}` } : { side: "away", line: `${a.line}` };
  }

  // Which side covered the spread, once a game is final - same
  // score-plus-line comparison used to grade picks, but at the game level
  // so anyone glancing at the board (not just someone with a pick on it)
  // can see who hit at a glance.
  function coveredSide(g, score) {
    if (!score || !score.completed || score.home_score == null || score.away_score == null) return null;
    const h = g.spread?.home, a = g.spread?.away;
    if (!h || h.line == null) return null;
    const adjustedHome = score.home_score + h.line;
    if (adjustedHome > score.away_score) return "home";
    if (adjustedHome < score.away_score) return "away";
    return "push";
  }

  // Games are already sorted by kickoff time, so same-day games are already
  // contiguous - group them under one header instead of repeating the day
  // on every row.
  function dayGroupKey(unixSeconds) {
    return new Date(unixSeconds * 1000).toDateString();
  }

  function fmtDayHeader(unixSeconds) {
    if (!unixSeconds) return "";
    const d = new Date(unixSeconds * 1000);
    return d.toLocaleString(undefined, { weekday: "long", month: "long", day: "numeric" });
  }

  // Kickoff time in the viewer's own local time zone - shown under the
  // matchup itself now, rather than the ESPN pre-game text (fixed to
  // Eastern) that used to live in the Score column.
  // Viewer's own browser time zone - the subtitle notes this so no one is
  // confused if a game's time doesn't match what they'd expect elsewhere.
  function fmtKickoffTime(unixSeconds) {
    if (!unixSeconds) return "";
    const d = new Date(unixSeconds * 1000);
    return d.toLocaleString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  // Mirrors the team-row stacking in the Matchup column (away line, then
  // home line) so each score sits directly beside the team it belongs to -
  // a bare "21-14" requires remembering an away-first convention, this doesn't.
  // Pre-game games show nothing here now - kickoff time moved under the matchup.
  function fmtScore(score, homeAway) {
    if (!score || score.state === "pre") return "";
    if (score.home_score == null || score.away_score == null) return "";
    const badge = score.completed
      ? `<span class="status-badge final">Final</span>`
      : `<span class="status-badge live">${score.detail || "Live"}</span>`;
    // Possession isn't always known (right after kickoff, between drives),
    // and is meaningless once the game's over.
    const awayBall = !score.completed && score.possession === "away" ? ' <span title="Has the ball">&#127944;</span>' : "";
    const homeBall = !score.completed && score.possession === "home" ? ' <span title="Has the ball">&#127944;</span>' : "";
    // Kept as a tight block (not spaced out to match the taller Matchup
    // column) and vertically centered in the row instead - away-first
    // order still ties it to the row above without needing exact
    // line-by-line alignment.
    return `
      <div class="score-row">${score.away_score}${awayBall}</div>
      <div class="score-row">${score.home_score}${homeBall}</div>
      <div class="status-line">${badge}</div>
    `;
  }

  // A finished game stays with the live/upcoming games for a short grace
  // period (so the result is easy to spot right after it happens), then
  // moves down to a separate, still-chronological history section instead
  // of permanently cluttering the top of the board for the rest of the week.
  const RECENT_COMPLETION_SECONDS = 15 * 60;
  function isOldCompletion(score, now) {
    return !!(score?.completed && score.completed_at != null && now - score.completed_at >= RECENT_COMPLETION_SECONDS);
  }

  function renderGamesTable(gamesList, scores, logoById, teamInfo) {
    // Scoped to just this table's own games, so e.g. the active table can
    // drop the Score column once nothing in it is live/finished, even if
    // the history table below still has real scores to show.
    const hasAnyScore = gamesList.some(g => {
      const s = scores[g.event_id];
      return s && s.state !== "pre" && s.home_score != null && s.away_score != null;
    });
    const rows = buildRows(gamesList, hasAnyScore, scores, logoById, teamInfo);
    return `
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Matchup</th>
              ${hasAnyScore ? '<th class="score-col">Score</th>' : ""}
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  // "#4 " ahead of a ranked team's name, matching the AP/committee-poll
  // convention everyone already recognizes from ESPN listings.
  function rankPrefix(rank) {
    return rank != null ? `#${rank} ` : "";
  }

  // Given its own line under the team name, since it and the rank/spread
  // already crowd one line's worth of text. Always rendered (even blank)
  // so the Matchup column keeps a fixed line count the Score column can
  // mirror for alignment.
  function recordRow(record) {
    return `<div class="team-record-row">${record || "&nbsp;"}</div>`;
  }

  function buildRows(gamesList, hasAnyScore, scores, logoById, teamInfo) {
    let lastDayKey = null;
    return gamesList.map((g, i) => {
      const fav = favoriteSide(g);
      const info = teamInfo[g.event_id];
      const awayLabel = logoImg(logoById.get(g.away_team_id)) + rankPrefix(info?.away_rank) + g.away_team + (fav?.side === "away" ? ` (${fav.line})` : "");
      const homeLabel = logoImg(logoById.get(g.home_team_id)) + rankPrefix(info?.home_rank) + g.home_team + (fav?.side === "home" ? ` (${fav.line})` : "");
      const pkLabel = fav?.side === "pk" ? " (PK)" : "";
      const covered = coveredSide(g, scores[g.event_id]);

      const dayKey = dayGroupKey(g.start_time);
      let header = "";
      if (dayKey !== lastDayKey) {
        header = `<tr class="day-header"><td colspan="${hasAnyScore ? 2 : 1}">${fmtDayHeader(g.start_time)}</td></tr>`;
        lastDayKey = dayKey;
      }

      return `
        ${header}
        <tr${i % 2 === 1 ? ' class="alt-row"' : ""}>
          <td>
            <div class="team-row${covered === "away" ? " covered" : ""}">${covered === "away" ? "&check; " : ""}${awayLabel}</div>
            ${recordRow(info?.away_record)}
            <div class="at-row">@</div>
            <div class="team-row${covered === "home" ? " covered" : ""}">${covered === "home" ? "&check; " : ""}${homeLabel}${pkLabel}</div>
            ${recordRow(info?.home_record)}
            <div class="kickoff">${fmtKickoffTime(g.start_time)}</div>
          </td>
          ${hasAnyScore ? `<td class="score-col">${fmtScore(scores[g.event_id])}</td>` : ""}
        </tr>
      `;
    }).join("");
  }

  async function load() {
    const statusEl = document.getElementById("status");
    const wrap = document.getElementById("tableWrap");
    try {
      const [oddsRes, scoresRes, teamsRes, teamInfoRes] = await Promise.all([
        fetch(DATA_URL, { cache: "no-store" }),
        fetch(SCORES_URL, { cache: "no-store" }).catch(() => null),
        fetch(TEAMS_URL, { cache: "no-store" }).catch(() => null),
        fetch(TEAM_INFO_URL, { cache: "no-store" }).catch(() => null)
      ]);
      if (!oddsRes.ok) throw new Error(`HTTP ${oddsRes.status}`);
      const data = await oddsRes.json();
      const games = data.games || [];
      const scoresData = scoresRes && scoresRes.ok ? await scoresRes.json() : { scores: {} };
      const scores = scoresData.scores || {};
      const teamsData = teamsRes && teamsRes.ok ? await teamsRes.json() : { teams: [] };
      const logoById = new Map((teamsData.teams || []).map(t => [t.id, t.logo]));
      const teamInfoData = teamInfoRes && teamInfoRes.ok ? await teamInfoRes.json() : { teams: {} };
      const teamInfo = teamInfoData.teams || {};

      const weekMatch = /^\d{4}-wk(\d{2})$/.exec(games[0]?.week || "");
      document.getElementById("pageTitle").textContent = weekMatch
        ? `NCAAF Odds - Week ${Number(weekMatch[1])}`
        : "NCAAF Odds";

      statusEl.textContent = `${games.length} games · updated ${new Date(data.generated_at).toLocaleString()}`;

      if (!games.length) {
        wrap.innerHTML = '<div class="empty">No upcoming NCAAF games with FanDuel odds right now.</div>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const activeGames = games.filter(g => !isOldCompletion(scores[g.event_id], now));
      const historyGames = games.filter(g => isOldCompletion(scores[g.event_id], now));

      const activeTable = activeGames.length ? renderGamesTable(activeGames, scores, logoById, teamInfo) : "";
      const historyTable = historyGames.length
        ? `<div class="week-heading">Earlier Results</div>${renderGamesTable(historyGames, scores, logoById, teamInfo)}`
        : "";

      wrap.innerHTML = activeTable + historyTable;
    } catch (err) {
      statusEl.textContent = `Failed to load odds: ${err.message}`;
    }
  }

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
