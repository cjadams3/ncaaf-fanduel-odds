<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NCAAF FanDuel Odds</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e2e2e2;
    --accent: #0b5fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --border: #2a2d35;
      --accent: #4d8dff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .status {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 16px;
  }
  table {
    width: 100%;
    max-width: 960px;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
    white-space: nowrap;
  }
  th {
    background: color-mix(in srgb, var(--card) 90%, var(--accent));
    font-weight: 600;
  }
  tr:last-child td { border-bottom: none; }
  .matchup { font-weight: 600; }
  .kickoff { color: var(--muted); font-size: 0.8rem; }
  .odds-cell { font-variant-numeric: tabular-nums; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
  <h1>NCAAF Odds &mdash; FanDuel</h1>
  <div class="subtitle">Point spread for upcoming games, refreshed every ~30 minutes.</div>
  <nav style="margin-bottom: 16px; font-size: 0.85rem;">
    <a href="pick.html" style="color: var(--accent); text-decoration: none; margin-right: 12px;">Make a pick</a>
    <a href="picks.html" style="color: var(--accent); text-decoration: none;">This week's picks</a>
  </nav>
  <div class="status" id="status">Loading…</div>
  <div id="tableWrap"></div>

<script>
  const DATA_URL = "https://familysportspool-odds-044528206038.s3.us-east-1.amazonaws.com/ncaaf/fanduel/latest.json";
  const SCORES_URL = "https://familysportspool-odds-044528206038.s3.us-east-1.amazonaws.com/ncaaf/fanduel/scores.json";
  const REFRESH_MS = 2 * 60 * 1000;

  function favoriteSpread(g) {
    const h = g.spread?.home, a = g.spread?.away;
    if (!h || !a || h.line == null || a.line == null) return "";
    if (h.line === 0) return "PK";
    return h.line < 0 ? `${h.line}` : `${a.line}`;
  }

  function fmtKickoff(unixSeconds) {
    if (!unixSeconds) return "";
    const d = new Date(unixSeconds * 1000);
    return d.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

  function fmtScore(score, homeAway) {
    if (!score) return '<span class="kickoff">&mdash;</span>';
    if (score.state === "pre") return `<span class="kickoff">${score.detail || "Scheduled"}</span>`;
    if (score.home_score == null || score.away_score == null) return '<span class="kickoff">&mdash;</span>';
    const label = score.completed ? "Final" : (score.detail || "Live");
    return `${score.away_score}-${score.home_score} <span class="kickoff">${label}</span>`;
  }

  async function load() {
    const statusEl = document.getElementById("status");
    const wrap = document.getElementById("tableWrap");
    try {
      const [oddsRes, scoresRes] = await Promise.all([
        fetch(DATA_URL, { cache: "no-store" }),
        fetch(SCORES_URL, { cache: "no-store" }).catch(() => null)
      ]);
      if (!oddsRes.ok) throw new Error(`HTTP ${oddsRes.status}`);
      const data = await oddsRes.json();
      const games = data.games || [];
      const scoresData = scoresRes && scoresRes.ok ? await scoresRes.json() : { scores: {} };
      const scores = scoresData.scores || {};

      statusEl.textContent = `${games.length} games · updated ${new Date(data.generated_at).toLocaleString()}`;

      if (!games.length) {
        wrap.innerHTML = '<div class="empty">No upcoming NCAAF games with FanDuel odds right now.</div>';
        return;
      }

      const rows = games.map(g => {
        const fav = favoriteSpread(g);
        return `
        <tr>
          <td>
            <div class="matchup">${g.away_team} @ ${g.home_team}${fav ? ` (${fav})` : ""}</div>
            <div class="kickoff">${fmtKickoff(g.start_time)}</div>
          </td>
          <td>${fmtScore(scores[g.event_id])}</td>
        </tr>
      `;
      }).join("");

      wrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Matchup</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    } catch (err) {
      statusEl.textContent = `Failed to load odds: ${err.message}`;
    }
  }

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
