<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NCAAF FanDuel Odds</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e2e2e2;
    --accent: #0b5fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --border: #2a2d35;
      --accent: #4d8dff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .status {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .table-scroll {
    max-width: 960px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table {
    width: 100%;
    min-width: 320px;
    border-collapse: collapse;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  th {
    background: color-mix(in srgb, var(--card) 90%, var(--accent));
    font-weight: 600;
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  .team-row { font-weight: 600; white-space: nowrap; }
  .team-row + .team-row { margin-top: 2px; }
  .team-logo { width: 18px; height: 18px; vertical-align: -3px; margin-right: 5px; object-fit: contain; border-radius: 3px; background: #fff; padding: 1px; }
  .kickoff { color: var(--muted); font-size: 0.8rem; margin-top: 3px; }
  .odds-cell { font-variant-numeric: tabular-nums; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 480px) {
    body { padding: 16px 12px 48px; }
    th, td { padding: 8px 10px; font-size: 0.85rem; }
  }
</style>
</head>
<body>
  <h1>NCAAF Odds &mdash; FanDuel</h1>
  <div class="subtitle">Point spread for upcoming games, refreshed every ~30 minutes.</div>
  <nav style="margin-bottom: 16px; font-size: 0.85rem;">
    <a href="pick.html" style="color: var(--accent); text-decoration: none; margin-right: 12px;">Make a pick</a>
    <a href="picks.html" style="color: var(--accent); text-decoration: none; margin-right: 12px;">This week's picks</a>
    <a href="season.html" style="color: var(--accent); text-decoration: none;">Season standings</a>
  </nav>
  <div class="status" id="status">Loading…</div>
  <div id="tableWrap"></div>

<script>
  const DATA_URL = "https://familysportspool-odds-044528206038.s3.us-east-1.amazonaws.com/ncaaf/fanduel/latest.json";
  const SCORES_URL = "https://familysportspool-odds-044528206038.s3.us-east-1.amazonaws.com/ncaaf/fanduel/scores.json";
  const TEAMS_URL = "https://familysportspool-odds-044528206038.s3.us-east-1.amazonaws.com/ncaaf/teams.json";
  const REFRESH_MS = 2 * 60 * 1000;

  function logoImg(logoUrl, teamName) {
    return logoUrl ? `<img class="team-logo" src="${logoUrl}" alt="" loading="lazy" />` : "";
  }

  // Returns which side (home/away) is favored and by how much, so the
  // spread can be displayed next to the correct team - not just appended
  // to the end of the matchup string, which would misattribute it whenever
  // the away team (not home) is favored.
  function favoriteSide(g) {
    const h = g.spread?.home, a = g.spread?.away;
    if (!h || !a || h.line == null || a.line == null) return null;
    if (h.line === 0) return { side: "pk", line: "PK" };
    return h.line < 0 ? { side: "home", line: `${h.line}` } : { side: "away", line: `${a.line}` };
  }

  // Just the day of week - the Score column already shows the full
  // date/time (from ESPN, pre-game) or live/final status, so repeating the
  // full kickoff timestamp here would be redundant. Weekday alone is worth
  // keeping since ESPN's text doesn't include it.
  function fmtDayOfWeek(unixSeconds) {
    if (!unixSeconds) return "";
    const d = new Date(unixSeconds * 1000);
    return d.toLocaleString(undefined, { weekday: "short" });
  }

  function fmtScore(score, homeAway) {
    if (!score) return '<span class="kickoff">&mdash;</span>';
    if (score.state === "pre") return `<span class="kickoff">${score.detail || "Scheduled"}</span>`;
    if (score.home_score == null || score.away_score == null) return '<span class="kickoff">&mdash;</span>';
    const label = score.completed ? "Final" : (score.detail || "Live");
    return `${score.away_score}-${score.home_score} <span class="kickoff">${label}</span>`;
  }

  async function load() {
    const statusEl = document.getElementById("status");
    const wrap = document.getElementById("tableWrap");
    try {
      const [oddsRes, scoresRes, teamsRes] = await Promise.all([
        fetch(DATA_URL, { cache: "no-store" }),
        fetch(SCORES_URL, { cache: "no-store" }).catch(() => null),
        fetch(TEAMS_URL, { cache: "no-store" }).catch(() => null)
      ]);
      if (!oddsRes.ok) throw new Error(`HTTP ${oddsRes.status}`);
      const data = await oddsRes.json();
      const games = data.games || [];
      const scoresData = scoresRes && scoresRes.ok ? await scoresRes.json() : { scores: {} };
      const scores = scoresData.scores || {};
      const teamsData = teamsRes && teamsRes.ok ? await teamsRes.json() : { teams: [] };
      const logoById = new Map((teamsData.teams || []).map(t => [t.id, t.logo]));

      statusEl.textContent = `${games.length} games · updated ${new Date(data.generated_at).toLocaleString()}`;

      if (!games.length) {
        wrap.innerHTML = '<div class="empty">No upcoming NCAAF games with FanDuel odds right now.</div>';
        return;
      }

      const rows = games.map(g => {
        const fav = favoriteSide(g);
        const awayLabel = logoImg(logoById.get(g.away_team_id)) + g.away_team + (fav?.side === "away" ? ` (${fav.line})` : "");
        const homeLabel = logoImg(logoById.get(g.home_team_id)) + g.home_team + (fav?.side === "home" ? ` (${fav.line})` : "");
        const pkLabel = fav?.side === "pk" ? " (PK)" : "";
        return `
        <tr>
          <td>
            <div class="team-row">${awayLabel}</div>
            <div class="team-row">${homeLabel}${pkLabel}</div>
            <div class="kickoff">${fmtDayOfWeek(g.start_time)}</div>
          </td>
          <td>${fmtScore(scores[g.event_id])}</td>
        </tr>
      `;
      }).join("");

      wrap.innerHTML = `
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Matchup</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    } catch (err) {
      statusEl.textContent = `Failed to load odds: ${err.message}`;
    }
  }

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
