<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>This Week's Picks</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e2e2e2;
    --accent: #0b5fff;
    --win-bg: #e6f4ea;
    --win-text: #1e7a34;
    --loss-bg: #fdeaea;
    --loss-text: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --border: #2a2d35;
      --accent: #4d8dff;
      --win-bg: #133d20;
      --win-text: #6fd08c;
      --loss-bg: #3d1414;
      --loss-text: #f28b82;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0 auto;
    max-width: 640px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
  nav { margin-bottom: 20px; font-size: 0.85rem; }
  nav a { color: var(--accent); text-decoration: none; margin-right: 12px; }
  nav a:hover { text-decoration: underline; }
  .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
  .table-scroll {
    max-width: 760px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table {
    width: 100%;
    min-width: 480px;
    border-collapse: collapse;
  }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  th { background: color-mix(in srgb, var(--card) 90%, var(--accent)); font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .team-logo { width: 18px; height: 18px; vertical-align: -3px; margin-right: 5px; object-fit: contain; border-radius: 3px; background: #fff; padding: 1px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
  .pill.pending { background: color-mix(in srgb, var(--card) 85%, var(--muted)); color: var(--muted); }
  .pill.win { background: var(--win-bg); color: var(--win-text); }
  .pill.loss { background: var(--loss-bg); color: var(--loss-text); }
  .pill.push { background: color-mix(in srgb, var(--card) 85%, var(--accent)); color: var(--accent); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .hidden-pick { color: var(--muted); font-style: italic; }
  .nav-toggle {
    display: none;
    width: 34px;
    height: 34px;
    padding: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }
  .nav-toggle span { display: block; width: 16px; height: 2px; background: var(--text); border-radius: 1px; }
  .page-head { display: flex; flex-direction: column; }
  @media (min-width: 601px) {
    .page-head nav { order: 1; }
  }
  @media (max-width: 600px) {
    nav { display: flex; justify-content: flex-start; position: relative; }
    .nav-toggle { display: flex; }
    .nav-links {
      display: none;
      position: absolute;
      top: 42px;
      left: 0;
      z-index: 20;
      flex-direction: column;
      gap: 2px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 0;
      min-width: 190px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    }
    .nav-links.open { display: flex; }
    .nav-links a { margin-right: 0; padding: 10px 16px; }
  }
  @media (max-width: 480px) {
    body { padding: 16px 12px 48px; }
    th, td { padding: 8px 10px; font-size: 0.85rem; }
  }
</style>
</head>
<body>
  <div class="page-head">
    <nav>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Odds Board</a>
        <a href="pick.html">Make Your Pick</a>
        <a href="season.html">Season Standings</a>
        <a href="recap.html">Weekly Recap</a>
      </div>
    </nav>
    <div class="title-block">
      <h1>This Week's Picks</h1>
      <div class="subtitle" id="weekLabel"></div>
    </div>
  </div>
  <div class="status" id="status">Loading…</div>
  <div id="tableWrap"></div>

<script>
  const navToggle = document.getElementById("navToggle");
  const navLinks = document.getElementById("navLinks");
  if (navToggle) {
    navToggle.addEventListener("click", () => {
      const isOpen = navLinks.classList.toggle("open");
      navToggle.setAttribute("aria-expanded", String(isOpen));
    });
    document.addEventListener("click", (e) => {
      if (!navLinks.classList.contains("open")) return;
      if (navLinks.contains(e.target) || navToggle.contains(e.target)) return;
      navLinks.classList.remove("open");
      navToggle.setAttribute("aria-expanded", "false");
    });
  }

  const API_BASE = "https://falbr3r26g.execute-api.us-east-1.amazonaws.com";
  const DATA_URL = "https://familysportspool-odds-044528206038.s3.us-east-1.amazonaws.com/ncaaf/fanduel/latest.json";
  const TEAMS_URL = "https://familysportspool-odds-044528206038.s3.us-east-1.amazonaws.com/ncaaf/teams.json";

  function logoImg(logoUrl) {
    return logoUrl ? `<img class="team-logo" src="${logoUrl}" alt="" loading="lazy" />` : "";
  }

  async function loadLogoMap() {
    try {
      const res = await fetch(TEAMS_URL, { cache: "no-store" });
      const data = await res.json();
      return new Map((data.teams || []).map(t => [t.id, t.logo]));
    } catch {
      return new Map();
    }
  }

  // Games are already sorted by kickoff time, so the earliest upcoming game's
  // week is "this week" - avoids duplicating ESPN's week-boundary logic here.
  async function currentWeek() {
    const res = await fetch(DATA_URL, { cache: "no-store" });
    const data = await res.json();
    return data.games?.[0]?.week || null;
  }

  function formatWeekLabel(weekKey) {
    const m = /^(\d{4})-wk(\d{2})$/.exec(weekKey || "");
    if (!m) return weekKey || "unknown";
    return `Week ${Number(m[2])}, ${m[1]}`;
  }

  function fmtSpread(price) {
    if (!price || price.line == null) return "&mdash;";
    return price.line > 0 ? `+${price.line}` : `${price.line}`;
  }

  function resultPill(pick) {
    const r = pick.result || "pending";
    const label = r === "pending" ? "Pending" : r.charAt(0).toUpperCase() + r.slice(1);
    let scoreText = "";
    if (r !== "pending" && pick.final_score_for != null) {
      scoreText = ` (${pick.final_score_for}-${pick.final_score_against})`;
    }
    return `<span class="pill ${r}">${label}${scoreText}</span>`;
  }

  // Picks stay hidden from the shared view until their game has actually
  // kicked off - otherwise someone could see a family member's pick and
  // copy (or fade) it before making their own.
  function isHiddenPick(pick, now) {
    return pick.game_start_time != null && pick.game_start_time > now;
  }

  async function load() {
    const statusEl = document.getElementById("status");
    const wrap = document.getElementById("tableWrap");

    try {
      const week = new URLSearchParams(location.search).get("week") || await currentWeek();
      if (!week) {
        document.getElementById("weekLabel").textContent = "";
        statusEl.textContent = "No upcoming games right now.";
        return;
      }
      document.getElementById("weekLabel").textContent = formatWeekLabel(week);

      const [picksRes, membersRes, logoById] = await Promise.all([
        fetch(`${API_BASE}/picks?week=${encodeURIComponent(week)}`, { cache: "no-store" }),
        fetch(`${API_BASE}/members`, { cache: "no-store" }),
        loadLogoMap()
      ]);
      if (!picksRes.ok) throw new Error(`HTTP ${picksRes.status}`);
      const data = await picksRes.json();
      const membersData = membersRes.ok ? await membersRes.json() : { members: [] };
      const nameById = new Map(membersData.members.map(m => [m.member_id, m.name]));

      const picks = (data.picks || [])
        .map(p => ({ ...p, display_name: nameById.get(p.member_id) || p.member_id }));

      // Members with no pick row yet this week (as opposed to a "No Pick"
      // row the grader writes once the week is over) still get a row, so
      // the table shows the whole roster's status, not just who's acted.
      const pickedMemberIds = new Set(picks.map(p => p.member_id));
      const notSubmitted = (membersData.members || [])
        .filter(m => !pickedMemberIds.has(m.member_id))
        .map(m => ({ member_id: m.member_id, display_name: m.name, not_submitted: true }));

      const rowsData = [...picks, ...notSubmitted].sort((a, b) => a.display_name.localeCompare(b.display_name));

      statusEl.textContent = `${picks.length} of ${membersData.members?.length ?? picks.length} picks so far`;

      if (!rowsData.length) {
        wrap.innerHTML = '<div class="empty">No picks yet for this week.</div>';
        return;
      }

      const now = Math.floor(Date.now() / 1000);
      const rows = rowsData.map(p => {
        if (p.not_submitted) {
          return `
        <tr>
          <td>${p.display_name}</td>
          <td><span class="hidden-pick">No pick yet</span></td>
          <td>&mdash;</td>
          <td>&mdash;</td>
          <td><span class="pill pending">Not submitted</span></td>
        </tr>
      `;
        }
        const hidden = isHiddenPick(p, now);
        const pickCell = hidden
          ? '<span class="hidden-pick">Hidden until kickoff</span>'
          : `${logoImg(logoById.get(p.team_id))}${p.team_name}`;
        const opponentCell = hidden ? "&mdash;" : `${logoImg(logoById.get(p.opponent_team_id))}${p.opponent_name}`;
        const spreadCell = hidden ? "&mdash;" : fmtSpread(p.spread_at_pick);
        return `
        <tr>
          <td>${p.display_name}</td>
          <td>${pickCell}</td>
          <td>${opponentCell}</td>
          <td>${spreadCell}</td>
          <td>${resultPill(p)}</td>
        </tr>
      `;
      }).join("");

      wrap.innerHTML = `
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th>Member</th><th>Pick</th><th>Opponent</th><th>Spread at pick</th><th>Result</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    } catch (err) {
      statusEl.textContent = `Failed to load picks: ${err.message}`;
    }
  }

  load();
</script>
</body>
</html>
