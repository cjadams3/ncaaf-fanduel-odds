<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weekly Recap</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e2e2e2;
    --accent: #0b5fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --border: #2a2d35;
      --accent: #4d8dff;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0 auto;
    max-width: 640px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
  nav { margin-bottom: 20px; font-size: 0.85rem; }
  nav a { color: var(--accent); text-decoration: none; margin-right: 12px; }
  nav a:hover { text-decoration: underline; }
  .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
  .article {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 22px;
  }
  .article h2 { font-size: 1.2rem; margin: 0 0 12px; }
  .article h3 { font-size: 1rem; margin: 20px 0 8px; }
  .article p { line-height: 1.55; margin: 0 0 12px; }
  .article ul { margin: 0 0 12px; padding-left: 20px; line-height: 1.5; }
  .article li { margin-bottom: 6px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .nav-toggle {
    display: none;
    width: 34px;
    height: 34px;
    padding: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }
  .nav-toggle span { display: block; width: 16px; height: 2px; background: var(--text); border-radius: 1px; }
  .page-head { display: flex; flex-direction: column; }
  nav { display: flex; justify-content: flex-start; position: relative; }
  .nav-toggle { display: flex; }
  .nav-links {
    display: none;
    position: absolute;
    top: 42px;
    left: 0;
    z-index: 20;
    flex-direction: column;
    gap: 2px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 0;
    min-width: 190px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.18);
  }
  .nav-links.open { display: flex; }
  .nav-links a { margin-right: 0; padding: 10px 16px; }
  .nav-group-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 10px 16px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
  }
  .nav-group-toggle::after {
    content: "▸";
    color: var(--muted);
    font-weight: 400;
    transition: transform 0.15s ease;
  }
  .nav-group-toggle[aria-expanded="true"]::after { transform: rotate(90deg); }
  .nav-group-links { display: none; flex-direction: column; }
  .nav-group-links.open { display: flex; }
  .nav-group-links a { display: block; margin-right: 0; padding: 8px 16px 8px 28px; }
  .nav-group + .nav-group { border-top: 1px solid var(--border); margin-top: 2px; padding-top: 2px; }
  @media (max-width: 480px) {
    body { padding: 16px 12px 48px; }
    .article { padding: 16px; }
  }
</style>
</head>
<body>
  <div class="page-head">
    <nav>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="nav-links" id="navLinks">
        <div class="nav-group">
          <button class="nav-group-toggle" type="button" aria-expanded="false">NCAAF</button>
          <div class="nav-group-links">
            <a href="index.html?sport=ncaaf">Odds Board</a>
            <a href="pick.html?sport=ncaaf">Make Your Pick</a>
            <a href="picks.html?sport=ncaaf">This Week's Picks</a>
            <a href="season.html?sport=ncaaf">Season Standings</a>
            <a href="recap.html?sport=ncaaf">Weekly Recap</a>
          </div>
        </div>
        <div class="nav-group">
          <button class="nav-group-toggle" type="button" aria-expanded="false">NFL</button>
          <div class="nav-group-links">
            <a href="index.html?sport=nfl">Odds Board</a>
            <a href="pick.html?sport=nfl">Make Your Pick</a>
            <a href="picks.html?sport=nfl">This Week's Picks</a>
            <a href="season.html?sport=nfl">Season Standings</a>
            <a href="recap.html?sport=nfl">Weekly Recap</a>
          </div>
        </div>
      </div>
    </nav>
    <div class="title-block">
      <h1 id="pageTitle">Weekly Recap</h1>
      <div class="subtitle">Straight from the week's picks and box scores.</div>
    </div>
  </div>
  <div class="status" id="status">Loading…</div>
  <div id="wrap"></div>

<script>
  const navToggle = document.getElementById("navToggle");
  const navLinks = document.getElementById("navLinks");
  if (navToggle) {
    navToggle.addEventListener("click", () => {
      const isOpen = navLinks.classList.toggle("open");
      navToggle.setAttribute("aria-expanded", String(isOpen));
    });
    document.addEventListener("click", (e) => {
      if (!navLinks.classList.contains("open")) return;
      if (navLinks.contains(e.target) || navToggle.contains(e.target)) return;
      navLinks.classList.remove("open");
      navToggle.setAttribute("aria-expanded", "false");
    });
  }
  for (const groupToggle of document.querySelectorAll(".nav-group-toggle")) {
    groupToggle.addEventListener("click", () => {
      const links = groupToggle.nextElementSibling;
      const isOpen = links.classList.toggle("open");
      groupToggle.setAttribute("aria-expanded", String(isOpen));
    });
  }

  // ?sport= in the URL wins and is remembered for next time; absent that,
  // fall back to whatever was last remembered; absent that, NCAAF.
  const sportParam = new URLSearchParams(location.search).get("sport");
  let sport = sportParam || "ncaaf";
  try {
    if (sportParam) localStorage.setItem("sport", sportParam);
    else sport = localStorage.getItem("sport") || "ncaaf";
  } catch {}
  const LEAGUE_LABEL = sport === "nfl" ? "NFL" : "NCAAF";
  document.title = `${LEAGUE_LABEL} Weekly Recap`;
  document.getElementById("pageTitle").textContent = `${LEAGUE_LABEL} Weekly Recap`;

  const RECAP_URL = `https://familysportspool-odds-044528206038.s3.us-east-1.amazonaws.com/${sport}/recap/latest.json`;

  function formatWeekLabel(weekKey) {
    const m = /^(\d{4})-wk(\d{2})$/.exec(weekKey || "");
    if (!m) return weekKey || "";
    return `Week ${Number(m[2])}, ${m[1]}`;
  }

  async function load() {
    const statusEl = document.getElementById("status");
    const wrap = document.getElementById("wrap");
    try {
      const res = await fetch(RECAP_URL, { cache: "no-store" });
      // A missing key returns 403 (not 404) when fetched anonymously - S3
      // doesn't reveal object existence to an unauthorized caller, and this
      // key genuinely isn't in the bucket's public-read policy at all for a
      // sport with no recap generator yet.
      if (res.status === 404 || res.status === 403) {
        statusEl.textContent = "";
        wrap.innerHTML = '<div class="empty">No recap yet - check back after this week\'s games wrap up.</div>';
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      if (!data.html) {
        statusEl.textContent = "";
        wrap.innerHTML = '<div class="empty">No recap yet - check back after this week\'s games wrap up.</div>';
        return;
      }

      statusEl.textContent = `${data.week_label || formatWeekLabel(data.week)} · published ${new Date(data.generated_at).toLocaleString()}`;
      wrap.innerHTML = `<div class="article">${data.html}</div>`;
    } catch (err) {
      statusEl.textContent = `Failed to load recap: ${err.message}`;
    }
  }

  load();
</script>
</body>
</html>
